  kimi-k2.6:
    provider: "openrouter"
    model_id: "moonshotai/kimi-k2.6"
    temperature: 0.0
    max_tokens: 48000
    reasoning:
      max_tokens: 10000
    cost_per_1m_prompt_usd: 0.74
    cost_per_1m_completion_usd: 3.49

  # ==================== Z.ai GLM 5 family ====================
  glm-5:
    provider: "openrouter"
    model_id: "z-ai/glm-5"
    temperature: 0.0
    max_tokens: 32000
    reasoning:
      max_tokens: 10000
    # Endpoint switch: default route was DeepInfra (fp4 quant,
    # max_completion=16384) which silently returns ~400-tok empty reasoning
    # for ~50 of our cases. Pin to Z.AI (model's home provider, fp16,
    # max_completion=131072, uptime 99.8%) with no fallback.
    provider_routing:
      order: ["Z.AI"]
      allow_fallbacks: false
    cost_per_1m_prompt_usd: 0.60
    cost_per_1m_completion_usd: 2.08

  glm-5.1:
    provider: "openrouter"
    model_id: "z-ai/glm-5.1"
    temperature: 0.0
    max_tokens: 16000
    cost_per_1m_prompt_usd: 1.05
    cost_per_1m_completion_usd: 3.50

  # ==================== MiniMax ====================
  minimax-m2.5:
    provider: "openrouter"
    model_id: "minimax/minimax-m2.5"
    temperature: 0.0
    max_tokens: 48000
    # OpenRouter rejects effort+max_tokens together; keep only max_tokens.
    reasoning:
      max_tokens: 10000
    # Endpoint switch: pin to Minimax's own infra (max_completion=131k,
    # uptime 99.2%) to avoid the cheap quantized upstream that returned
    # ~400-tok empty responses on ~30 of 37 failed cases.
    provider_routing:
      order: ["Minimax"]
      allow_fallbacks: true
    cost_per_1m_prompt_usd: 0.15
    cost_per_1m_completion_usd: 1.15

