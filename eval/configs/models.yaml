# Model registry. The `model_id` is the actual string sent to the OpenAI API.
# Update model_id and pricing to match your real targets.
# API key is read from the OPENAI_API_KEY environment variable.

models:
  gpt-5.4-nano:
    model_id: "gpt-5-nano"
    temperature: 0.0
    # NOTE: gpt-5 family are reasoning models — completion budget includes
    # internal reasoning tokens. Need a generous cap or final JSON gets cut off
    # (and you'll see content="" with missing=100).
    max_tokens: 16000
    # USD per 1M tokens (used only for cost estimation in CSVs)
    cost_per_1m_prompt_usd: 0.15
    cost_per_1m_completion_usd: 0.60


  gpt-5.4-mini:
    model_id: "gpt-5-mini"
    temperature: 0.0
    max_tokens: 16000
    cost_per_1m_prompt_usd: 1.25
    cost_per_1m_completion_usd: 5.00

  gpt-5.4:
    model_id: "gpt-5"
    temperature: 0.0
    max_tokens: 16000
    cost_per_1m_prompt_usd: 5.00
    cost_per_1m_completion_usd: 15.00

