  # ==================== Google AI Studio — Gemini (API key, -api suffix) ====================
  # Reads GEMINI_API_KEY from env. Higher quotas than Vertex's region buckets
  # but hot models can 503 during peak.
  # The "-api" suffix keeps these distinct from the Vertex entries above
  # (different cache keys, different run dirs).
  gemini-2.5-flash-api:
    provider: "google_genai_apikey"
    model_id: "gemini-2.5-flash"
    temperature: 0.0
    max_tokens: 16000
    thinking_budget: 0
    cost_per_1m_prompt_usd: 0.30
    cost_per_1m_completion_usd: 2.50

