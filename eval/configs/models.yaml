    model_id: "gemini-3-flash-preview"
    temperature: 0.0
    max_tokens: 16000
    # Disable thinking — observed missing=100 (full failure) on C1_traj14d
    # and C4_skyline conditions when thinking is on.
    thinking_budget: 0
    cost_per_1m_prompt_usd: 0.40
    cost_per_1m_completion_usd: 3.00

