  # ==================== Vertex AI — Gemini (ADC) ====================
  # Vertex hits region-specific endpoints with Application Default Credentials.
  # Set GOOGLE_CLOUD_PROJECT env var or replace `project_id` below with your own.
  gemini-2.5-flash:
    provider: "vertex_gemini"
    project_id: "YOUR_GCP_PROJECT"
    location: "us-central1"
    model_id: "gemini-2.5-flash"
    temperature: 0.0
    max_tokens: 16000
    # Disable thinking — otherwise it eats the output token budget and
    # truncates JSON mid-stream (observed missing=29-30 letters).
    thinking_budget: 0
    cost_per_1m_prompt_usd: 0.30
    cost_per_1m_completion_usd: 2.50

  gemini-2.5-flash-lite:
    provider: "vertex_gemini"
    project_id: "YOUR_GCP_PROJECT"
    location: "us-central1"
    model_id: "gemini-2.5-flash-lite"
